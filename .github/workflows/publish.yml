name: Publish Jupyter Book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract book source
        run: unzip book-source.zip -d book
      - name: Install Jupyter Book
        run: pip install -r book/requirements.txt
      - name: Build book
        run: jupyter-book build book --warningiserror
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: book/_build/html
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
